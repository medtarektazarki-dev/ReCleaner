name: Build REcleaner for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "src/**"
      - "scripts/app-env-plugin.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.desktop.config.ts"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: recleaner-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y curl unzip

      - name: Install project dependencies
        run: npm ci

      - name: Typecheck and test before building
        shell: bash
        run: |
          npm run typecheck
          npm test
          for dir in desktop/installer/setup desktop/installer/uninstall; do
            (cd "$dir" && go test ./...)
          done

      - name: Install pinned desktop build dependencies
        run: npm install --no-save --package-lock=false esbuild@0.28.2 @resvg/resvg-js@2.6.2 png-to-ico@3.0.2 resedit@3.1.0

      - name: Build Windows application
        run: npm run desktop:build

      - name: Verify generated files
        shell: bash
        run: |
          test -s "artifacts/REcleaner-win64.zip"
          test -s "artifacts/REcleaner.Setup.exe"
          test -s "artifacts/REcleaner.ico"
          unzip -l "artifacts/REcleaner-win64.zip" | grep -q "REcleaner.exe"
          file "artifacts/REcleaner.Setup.exe"
          (cd artifacts && sha256sum "REcleaner-win64.zip" "REcleaner.Setup.exe" "REcleaner.ico" > SHA256SUMS.txt)
          (cd artifacts && sha256sum --check SHA256SUMS.txt)

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: REcleaner-Windows-x64
          path: |
            artifacts/REcleaner-win64.zip
            artifacts/REcleaner.Setup.exe
            artifacts/REcleaner.ico
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable continuous build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          tag="build-${SOURCE_SHA:0:12}"
          title="REcleaner Windows build ${SOURCE_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "artifacts/REcleaner.Setup.exe" \
              "artifacts/REcleaner-win64.zip" \
              "artifacts/REcleaner.ico" \
              "artifacts/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$tag" \
              "artifacts/REcleaner.Setup.exe" \
              "artifacts/REcleaner-win64.zip" \
              "artifacts/REcleaner.ico" \
              "artifacts/SHA256SUMS.txt" \
              --title "$title" \
              --notes "Automated Windows x64 build from commit ${SOURCE_SHA}. This is a prerelease build, not a stable signed release. Review SECURITY.md before installing." \
              --prerelease
          fi
