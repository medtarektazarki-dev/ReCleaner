name: Quality Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: recleaner-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit and invariant tests
        run: npm test

      - name: Lint
        run: npm run lint
