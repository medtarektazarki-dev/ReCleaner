name: Quality Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "vite.config.ts"
      - "vite.desktop.config.ts"
      - "vercel.json"
      - ".github/workflows/quality.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "vite.config.ts"
      - "vite.desktop.config.ts"
      - "vercel.json"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: recleaner-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit and invariant tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Installer tests and Windows vet
        shell: bash
        run: |
          for dir in desktop/installer/setup desktop/installer/uninstall; do
            (cd "$dir" && test -z "$(gofmt -l .)" && go vet ./... && go test ./... && GOOS=windows GOARCH=amd64 go vet ./...)
          done
